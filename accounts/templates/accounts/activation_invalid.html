{% extends "base.html" %}

{% block title %}Ссылка недействительна — Кулинарный портал{% endblock %}

{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm text-center border-warning">
                <div class="card-body p-4">
                    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
                    <h2 class="h4 mt-3">Ссылка недействительна</h2>
                    <p class="text-muted">
                        Срок действия ссылки истёк или она повреждена.
                        Запросите новое письмо на странице входа.
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">
                        <i class="bi bi-box-arrow-in-right"></i> К странице входа
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
