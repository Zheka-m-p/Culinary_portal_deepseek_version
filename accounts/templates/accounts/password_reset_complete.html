{% extends "base.html" %}

{% block title %}Пароль восстановлен — Кулинарный портал{% endblock %}

{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm text-center">
                <div class="card-body p-4">
                    <i class="bi bi-shield-check text-success" style="font-size: 4rem;"></i>
                    <h2 class="h4 mt-3">Пароль восстановлен</h2>
                    <p class="text-muted">
                        Ваш пароль успешно изменён. Теперь вы можете войти с новым паролем.
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
